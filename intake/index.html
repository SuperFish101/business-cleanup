<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's eating your time? | Soares Systems</title>
  <meta name="description" content="Tell Darren what eats your time. He reads every word, then shows you what could come off your plate.">
  <meta name="robots" content="noindex">
  <!-- Runs before paint so the brand bar never flashes inside the site's chat panel. -->
  <script>if(location.search.indexOf('embed=1')>-1)document.documentElement.className='embed';</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231C5A43'/%3E%3Crect x='27' y='27' width='21' height='21' rx='5' fill='%23FFFFFF'/%3E%3Crect x='52' y='27' width='21' height='21' rx='5' fill='%23FFFFFF'/%3E%3Crect x='27' y='52' width='21' height='21' rx='5' fill='%23D8A24A'/%3E%3Crect x='52' y='52' width='21' height='21' rx='5' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <style>
    /* Brand: Deep Green & Amber (../brand/brand-guide.md) */
    :root{
      --ground:#F6F5EF; --ground2:#ECEADF; --card:#FFFFFF;
      --green:#1C5A43; --green-bright:#25714F;
      --amber:#C6892A; --amber-soft:#D8A24A;
      --ink:#1E2620; --ink-soft:#535A52; --ink-faint:#727A70;
      --line:#E4E1D5; --line-soft:#EFECE2;
      --radius:14px;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --serif:Georgia,"Times New Roman",serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:var(--ground); color:var(--ink); font-family:var(--sans);
      font-size:17px; line-height:1.5; display:flex; flex-direction:column;
      min-height:100dvh;
    }
    a{color:var(--green)}

    /* Header. Hidden when this page is embedded in the site's chat panel (?embed=1): the host
       page already says Soares Systems, so a second brand bar is just noise. The panel's close
       button floats in the space the padding below leaves for it. */
    header{
      display:flex; align-items:center; gap:10px;
      padding:14px 18px; border-bottom:1px solid var(--line); background:var(--card);
    }
    header svg{width:30px;height:30px;flex:none;border-radius:8px}
    header .name{font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink)}
    header .tag{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint)}
    .embed header{display:none}
    .embed main{padding-top:44px}

    /* Chat area */
    main{flex:1 1 auto; overflow-y:auto; padding:18px; -webkit-overflow-scrolling:touch}
    .wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
    .note{
      font-size:13px; color:var(--ink-faint); background:var(--ground2);
      border:1px solid var(--line); border-radius:10px; padding:10px 12px; text-align:center;
    }
    .msg{max-width:85%; padding:12px 14px; border-radius:var(--radius); white-space:pre-wrap; word-wrap:break-word}
    .msg.them{background:var(--card); border:1px solid var(--line); align-self:flex-start; border-top-left-radius:4px}
    .msg.you{background:var(--green); color:#fff; align-self:flex-end; border-top-right-radius:4px}
    .typing{align-self:flex-start; color:var(--ink-faint); font-size:14px; padding:4px 2px}
    .typing span,.dots span{display:inline-block; animation:blink 1.2s infinite}
    .typing span:nth-child(2),.dots span:nth-child(2){animation-delay:.2s}
    .typing span:nth-child(3),.dots span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

    /* Composer. Sizes follow skills/ui-ux-pro-max: 44px touch targets, 8px gaps, SVG icons
       (never emoji), aria-labels on the icon-only buttons, a persistent helper line. */
    footer{border-top:1px solid var(--line); background:var(--card);
      padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
    .composer{max-width:640px; margin:0 auto; display:flex; gap:8px; align-items:flex-end}
    textarea{
      flex:1 1 auto; resize:none; min-height:44px; max-height:132px; padding:11px 12px;
      border:1px solid var(--line); border-radius:12px; font-family:inherit; font-size:16px;
      line-height:1.35; color:var(--ink); background:var(--ground);
    }
    textarea:focus{outline:2px solid var(--green); outline-offset:1px}
    .iconbtn{
      flex:none; width:44px; height:44px; border-radius:50%; cursor:pointer;
      border:1px solid var(--line); background:var(--ground2); color:var(--green);
      display:grid; place-items:center; padding:0;
      transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
    }
    .iconbtn svg{width:22px; height:22px; display:block}
    .iconbtn:active{transform:scale(.96)}
    .iconbtn:focus-visible{outline:2px solid var(--green); outline-offset:2px}
    .rec:hover{background:var(--line-soft)}
    .rec.on{background:var(--amber); border-color:var(--amber); color:#fff; animation:pulse 1.4s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,137,42,.45)}100%{box-shadow:0 0 0 12px rgba(198,137,42,0)}}
    .send{background:var(--green); border-color:var(--green); color:#fff}
    .send:hover:not(:disabled){background:var(--green-bright); border-color:var(--green-bright)}
    .send:disabled{opacity:.4; cursor:default}

    /* Secondary row: reading replies aloud is OFF until someone asks for it. */
    .crow{max-width:640px; margin:8px auto 0; display:flex; align-items:center;
      justify-content:space-between; gap:10px; flex-wrap:wrap}
    .voice{
      display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:0 13px;
      border-radius:999px; border:1px solid var(--line); background:var(--ground);
      color:var(--ink-soft); font-family:inherit; font-size:13px; cursor:pointer;
      transition:background .15s ease, color .15s ease, border-color .15s ease;
    }
    .voice svg{width:17px; height:17px; flex:none}
    .voice:hover{border-color:var(--green); color:var(--green)}
    .voice[aria-pressed="true"]{background:var(--amber); border-color:var(--amber); color:#1E2620; font-weight:600}
    .voice:focus-visible{outline:2px solid var(--green); outline-offset:2px}
    .voice .von{display:none}
    .voice[aria-pressed="true"] .voff{display:none}
    .voice[aria-pressed="true"] .von{display:block}
    .wrapup{background:none; border:none; cursor:pointer; color:var(--green); font-size:13px;
      text-decoration:underline; font-family:inherit; min-height:38px; padding:0 4px}
    .hint{max-width:640px; margin:6px auto 0; font-size:12px; color:var(--ink-faint); text-align:center}
    @media (prefers-reduced-motion:reduce){ .rec.on{animation:none} .iconbtn{transition:none} }

    /* End / booking */
    .book{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; text-align:center}
    .book h2{font-family:var(--serif); font-size:22px; margin:.1em 0 .5em}
    .book .btn{
      display:inline-block; margin-top:10px; padding:14px 22px; background:var(--green); color:#fff;
      border-radius:12px; text-decoration:none; font-weight:700;
    }
    .book .btn:hover{background:var(--green-bright)}

    .hidden{display:none !important}
    @media (max-width:480px){ body{font-size:16px} .msg{max-width:90%} }
  </style>
</head>

  <main>

      <!-- No start gate. The first question is on screen the moment the page opens, so people can
           read it before deciding to talk. The pitch that used to live here is now the #ask band on

      <div class="note">About ten minutes, or faster if you pour it all out in one go. Talk or type, whichever is easier. Wrap it up any time.</div>

    </div>
  </main>

  <footer id="composer">
    <div class="composer">
      <!-- Short on purpose: the composer is narrow in the panel, and the hint line below carries

      <textarea id="text" rows="1" placeholder="Type your answer"></textarea>
      <button class="iconbtn rec" id="rec" type="button" aria-label="Record your answer">
        <svg id="recicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
      </button>
      <button class="iconbtn send" id="send" type="button" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="crow">
      <button class="voice" id="voice" type="button" aria-pressed="false">
        <svg class="voff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M22 9l-5 6M17 9l5 6"/></svg>
        <svg class="von" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.6 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M18.7 5.5a9 9 0 0 1 0 13"/></svg>
        <span id="voicelabel">Read replies out loud</span>
      </button>
      <button class="wrapup" id="wrapup" type="button">Done? Wrap it up</button>
    </div>
    <div class="hint" id="hint" aria-live="polite">Type your answer, or tap the mic and just talk.</div>
  </footer>

  <script>
  (function(){
    "use strict";

    // ===== CONFIG (Darren: paste your values after building the n8n workflow) =====
    var N8N_WEBHOOK_URL = "https://systems31.app.n8n.cloud/webhook/pain-point-intake"; // the live n8n webhook
    var SHARED_SECRET   = "ss-intake-kp39xr7mq2"; // must match const SECRET in the n8n "Build request" Code node
    var BOOKING_URL     = "https://soaressystems.com/call/"; // the private booking page (website/CURRENT-SITE.md)
    // =============================================================================

    // The interview's fixed first line. The page shows and speaks it instantly (no server
    // round-trip); the n8n prompt expects the conversation to open with it and continues from there.
    var OPENING_TEXT = "Hey, thanks for doing this. I'm going to ask you a handful of quick questions for Darren, all about what eats up your time. There are no right answers, and you can talk as long as you want. This is recorded so Darren can see how to help you. And if you'd rather just pour it all out at once, go ahead, I'll follow along. First up, what should I call you?";

    var els = {
      wrap: document.getElementById('wrap'),
      composer: document.getElementById('composer'),
      rec: document.getElementById('rec'),
      recicon: document.getElementById('recicon'),
      text: document.getElementById('text'),
      send: document.getElementById('send'),
      hint: document.getElementById('hint'),
      wrapup: document.getElementById('wrapup'),
      voice: document.getElementById('voice'),
      voicelabel: document.getElementById('voicelabel'),
      player: document.getElementById('player'),
      main: document.querySelector('main')
    };

    var MIC_ICON = '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>';
    var STOP_ICON = '<rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"/>';

    // ---- reading replies out loud is OFF by default ----
    // Most people open this at work and do not want a voice starting up. It also costs money per
    // reply, so we only generate it when someone asks for it. The n8n side reads payload.speak.
    var VKEY = 'ss_intake_voice';
    var voiceOn = false;
    try{ voiceOn = localStorage.getItem(VKEY) === '1'; }catch(e){}

    // ---- session id (stable across reloads so a session can resume) ----
    var SKEY = 'ss_intake_session';
    var sessionId = localStorage.getItem(SKEY);
    if(!sessionId){
      sessionId = 'ss_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
      localStorage.setItem(SKEY, sessionId);
    }
    var TKEY = 'ss_intake_log_' + sessionId; // saved transcript for resume

    var busy = false, finished = false;
    var pendingVoiceBubble = null; // the "(voice answer)" bubble waiting for its transcription

    // The page holds the conversation. n8n stays stateless: it gets the history, transcribes any new
    // audio, asks Claude for the next line, speaks it, and (on the last turn) files everything.
    function getLog(){ return JSON.parse(localStorage.getItem(TKEY) || '[]'); }
    function pushLog(who, textVal){ var l=getLog(); l.push({who:who, text:textVal}); localStorage.setItem(TKEY, JSON.stringify(l)); }
    function history(){ return getLog().map(function(m){ return { role: m.who==='them'?'assistant':'user', text:m.text }; }); }

    // ---------- UI helpers ----------
    function scroll(){ els.main.scrollTop = els.main.scrollHeight; }
    function bubble(who, textVal){
      var d = document.createElement('div');
      d.className = 'msg ' + (who === 'you' ? 'you' : 'them');
      d.textContent = textVal;
      els.wrap.appendChild(d); scroll(); return d;
    }
    function typing(on){
      var ex = document.getElementById('typing');
      if(on){ if(ex) return; var t=document.createElement('div'); t.className='typing'; t.id='typing';
        t.innerHTML='<span>.</span><span>.</span><span>.</span>'; els.wrap.appendChild(t); scroll(); }
      else if(ex){ ex.remove(); }
    }
    function restoreLog(){
      var log = getLog(); if(!log.length) return false;
      log.forEach(function(m){ bubble(m.who, m.text); });
      return true;
    }
    function playAudio(b64){
      if(!voiceOn || !b64) return;
      try{ els.player.src = 'data:audio/mpeg;base64,' + b64; els.player.play().catch(function(){}); }
      catch(e){}
    }
    function stopVoice(){ try{ els.player.pause(); }catch(e){} }
    function showBooking(msg){
      finished = true;
      els.composer.classList.add('hidden');
      var b = document.createElement('div');
      b.className = 'book';
      b.innerHTML = '<h2>Thanks. One last step.</h2>' +
        '<p>' + (msg || 'Grab a time with Darren below. He will have read everything you shared before you talk.') + '</p>' +
        '<a class="btn" href="' + BOOKING_URL + '" target="_blank" rel="noopener">Book a time with Darren</a>';
      els.wrap.appendChild(b); scroll();
      localStorage.removeItem(TKEY); // interview done, clear the resume cache
    }
    function failSoft(){
      typing(false); busy=false;
      if(pendingVoiceBubble){ pendingVoiceBubble.textContent='(voice answer)'; pendingVoiceBubble=null; }
      bubble('them', "Sorry, something hiccuped on my end. Don't worry, nothing you said was lost.");
      showBooking("Grab a time with Darren here and he'll pick it up from your side.");
    }

    // ---------- one server turn ----------
    // isVoice: this turn sent audio, so we expect res.answerText (the transcription) back to fill the bubble.
    function turn(payload, isVoice){
      if(finished) return;
      busy = true; els.send.disabled = true; typing(true);
      payload.sessionId = sessionId; payload.secret = SHARED_SECRET; payload.history = history();

        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      })
      .then(function(r){ if(!r.ok) throw new Error('bad status ' + r.status); return r.json(); })
      .then(function(res){
        typing(false); busy = false;
        // fill in a voice answer's transcription (so the record + resume are complete)
        if(isVoice){
          var said = res.answerText || '(voice answer)';
          if(pendingVoiceBubble){ pendingVoiceBubble.textContent = said; pendingVoiceBubble=null; }
          pushLog('you', said);
        }
        var q = res.questionText || res.question || '';
        if(q){ bubble('them', q); pushLog('them', q); }
        playAudio(res.audioBase64 || res.audio);
        if(res.done){ showBooking(res.closingText); }
        else { els.send.disabled = els.text.value.trim() === ''; }
      })
      .catch(function(err){ console.error(err); failSoft(); });
    }

    // ---------- reading replies out loud ----------
    function syncVoiceBtn(){
      els.voice.setAttribute('aria-pressed', voiceOn ? 'true' : 'false');
      els.voicelabel.textContent = voiceOn ? 'Reading replies out loud' : 'Read replies out loud';
    }
    els.voice.addEventListener('click', function(){
      voiceOn = !voiceOn;
      try{ localStorage.setItem(VKEY, voiceOn ? '1' : '0'); }catch(e){}
      syncVoiceBtn();
      if(voiceOn){ els.hint.textContent = 'Replies will be read out loud from here on.'; }
      else { stopVoice(); els.hint.textContent = 'Replies stay silent. Turn it back on any time.'; }
    });
    syncVoiceBtn();

    // ---------- start ----------
    // No gate. The opening question is on screen immediately (it is baked into the page, so it
    // costs no server turn) and the composer is ready. The first webhook call is their first answer.
    if(!restoreLog()){
      bubble('them', OPENING_TEXT); pushLog('them', OPENING_TEXT);
      // Only speak the opening if they already asked for voice on an earlier visit.
      if(voiceOn){ try{ els.player.src = window.SS_OPENING_AUDIO || ''; els.player.play().catch(function(){}); }catch(e){} }
    }
    els.send.disabled = true;

    // ---------- text input ----------
    function autogrow(){ els.text.style.height='auto'; els.text.style.height=Math.min(els.text.scrollHeight,140)+'px'; }
    els.text.addEventListener('input', function(){ autogrow(); els.send.disabled = busy || els.text.value.trim()===''; });
    els.text.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!els.send.disabled) els.send.click(); }
    });
    els.send.addEventListener('click', function(){
      if(busy || finished) return;
      var v = els.text.value.trim(); if(!v) return;
      stopVoice();                                 // sending = interrupting; cut the voice off
      bubble('you', v); pushLog('you', v);         // record BEFORE the turn, so history includes it
      els.text.value=''; autogrow();
      turn({ type:'answer' }, false);
    });

    // ---------- wrap it up (visitor-controlled fast-forward; wrap:true is a hard override in n8n) ----------
    els.wrapup.addEventListener('click', function(){
      if(busy || finished) return;
      stopVoice();
      bubble('you', "Let's wrap this up."); pushLog('you', "Let's wrap this up.");
      turn({ type:'answer', wrap:true }, false);
    });

    // ---------- voice recording (tap to start, tap to stop) ----------
    var mediaRecorder = null, chunks = [], recording = false, stream = null, cancelling = false;

    function setRecUI(on){
      els.rec.classList.toggle('on', on);
      els.recicon.innerHTML = on ? STOP_ICON : MIC_ICON;
      els.rec.setAttribute('aria-label', on ? 'Stop recording' : 'Record your answer');
    }

    function b64FromBlob(blob){
      return new Promise(function(resolve, reject){
        var fr = new FileReader();
        fr.onloadend = function(){ resolve(String(fr.result).split(',')[1]); };
        fr.onerror = reject; fr.readAsDataURL(blob);
      });
    }
    function pickMime(){
      var opts = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
      for(var i=0;i<opts.length;i++){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i]; }
      return '';
    }
    function startRec(){
      if(recording || busy || finished) return;
      stopVoice();                                 // tapping the mic interrupts the interviewer
      if(!navigator.mediaDevices || !window.MediaRecorder){ noMic(); return; }
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
        stream = s;
        var mime = pickMime();
        mediaRecorder = mime ? new MediaRecorder(s,{mimeType:mime}) : new MediaRecorder(s);
        chunks = [];
        mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
        mediaRecorder.onstop = function(){
          var mimeType = mediaRecorder.mimeType || 'audio/webm';
          var blob = new Blob(chunks, {type: mimeType});
          stream.getTracks().forEach(function(t){ t.stop(); });
          if(cancelling){ cancelling = false; return; } // panel was closed mid-recording
          if(blob.size < 800){ els.hint.textContent='Did not catch that, try again.'; return; }
          pendingVoiceBubble = bubble('you', '');   // dots until the transcription replaces them
          pendingVoiceBubble.innerHTML = '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
          b64FromBlob(blob).then(function(b64){
            turn({ type:'answer', audioBase64:b64, mime:mimeType }, true);
          });
        };
        mediaRecorder.start();
        recording = true; setRecUI(true);
        els.hint.textContent='Recording. Tap the square when you are done.';
      }).catch(function(){ noMic(); });
    }
    function stopRec(){
      if(!recording) return;
      recording = false; setRecUI(false);
      els.hint.textContent='Got it, one sec...';
      try{ mediaRecorder.stop(); }catch(e){}
    }
    function cancelRec(){
      if(!recording) return;
      cancelling = true; recording = false; setRecUI(false);
      els.hint.textContent='Type your answer, or tap the mic and just talk.';
      try{ mediaRecorder.stop(); }catch(e){}
    }
    function noMic(){
      els.hint.textContent='No microphone access. No problem, just type your answers below.';
      els.rec.classList.add('hidden'); els.text.focus();
    }
    els.rec.addEventListener('click', function(){ recording ? stopRec() : startRec(); });

    // ---------- what the host page can ask of us ----------
    // The sales pages open this in a panel. Closing that panel has to shut the voice up and let
    // go of the microphone; without this the interviewer keeps talking behind a closed panel.
    window.SS_INTAKE = { stop: function(){ stopVoice(); cancelRec(); } };
  })();
  </script>
</body>
</html>
