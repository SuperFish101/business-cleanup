<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk to Darren | Soares Systems</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231C5A43'/%3E%3Crect x='27' y='27' width='21' height='21' rx='5' fill='%23FFFFFF'/%3E%3Crect x='52' y='27' width='21' height='21' rx='5' fill='%23FFFFFF'/%3E%3Crect x='27' y='52' width='21' height='21' rx='5' fill='%23D8A24A'/%3E%3Crect x='52' y='52' width='21' height='21' rx='5' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <!--
    The link Darren hands a client: soaressystems.com/talk/?k=<their key>

    This is a doormat, not a page. It exists so the client-facing link stays short and stable while
    the actual tool stays in ONE file (intake.html). Two copies of that page would drift the first
    time either one got fixed. Design: ../intake/dump-mode.md

    "talk", not "dump", in everything a client sees: the folder, the query value, the page title.
    The word "dump" survives internally (the n8n flag, the docs, the roster) because renaming the
    wire protocol would mean re-testing a workflow that is already proven, for no gain a client
    would ever notice. intake.html maps talk -> dump on the way to the server.

    The key is carried straight through. A missing or wrong key is NOT an error here: intake.html
    still takes the whole thing and n8n files it under _unmatched, because turning someone away is
    the one failure this system does not allow.
  -->
  <style>
    body{margin:0;height:100dvh;display:flex;align-items:center;justify-content:center;
      background:#F6F5EF;color:#535A52;
      font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    a{color:#1C5A43}
  </style>
  <script>
    (function () {
      var k = new URLSearchParams(location.search).get('k') || '';
      location.replace('/intake/?mode=talk' + (k ? '&k=' + encodeURIComponent(k) : ''));
    })();
  </script>
</head>
<body>
  <!-- Only ever seen if JavaScript is off, which also means the tool itself cannot run. -->
  <p>Opening&hellip; <a href="/intake/?mode=talk">tap here if nothing happens</a>.</p>
</body>
</html>
